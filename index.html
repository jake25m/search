<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de mesas</title>
<style>
:root{--navy:#17324d;--teal:#167c80;--bg:#f3f6f8;--line:#dce4e9;--muted:#667580}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172b3a}
header{background:var(--navy);color:white;padding:28px 18px;text-align:center}h1{margin:0;font-size:clamp(24px,5vw,34px)}header p{margin:7px 0 0;color:#d7e8f0}
main{max-width:850px;margin:22px auto;padding:0 15px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #17324d0a}
.tabs{display:flex;gap:8px}.tab,button{border:0;border-radius:10px;padding:12px 15px;font-weight:650;cursor:pointer;font-size:14px}.tab{background:#edf2f5;color:var(--navy);flex:1}.tab.active,button.primary{background:var(--teal);color:#fff}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd6dd;border-radius:10px;font:inherit}.results{display:grid;gap:9px;margin-top:12px}.person{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}.pill{background:#e8f4f3;color:#12666a;border-radius:99px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap}.empty{color:var(--muted);padding:15px;text-align:center;background:#f7f9fa;border-radius:10px}.hint{color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:560px){.card{padding:14px}.person{align-items:flex-start}}
</style>
</head>
<body>
<header><h1>CONSULTA DE MESAS</h1><p>Encuentra tu mesa de forma rápida</p></header>
<main>
<section class="card">
 <div class="tabs">
  <button class="tab active" id="byName">Buscar persona</button>
  <button class="tab" id="byTable">Buscar mesa</button>
 </div>
 <label id="searchLabel" for="searchInput">Nombre de la persona</label>
 <input id="searchInput" placeholder="Escribe tu nombre..." autocomplete="off">
 <div id="results" class="results"><div class="empty">Escribe un nombre para consultar.</div></div>
 <p class="hint">Listado de consulta del evento. No necesitas iniciar sesión ni instalar ninguna aplicación.</p>
</section>
</main>
<script>
// EDITA AQUÍ LOS NOMBRES Y NÚMEROS DE MESA.
// Formato: { nombre: "Nombre Apellido", mesa: 1 }
const personas = [
  { nombre: "Juan Pérez", mesa: 1 },
  { nombre: "María López", mesa: 1 },
  { nombre: "Carlos Gómez", mesa: 1 },
  { nombre: "Ana Rodríguez", mesa: 1 },
  { nombre: "Pedro Ruiz", mesa: 2 },
  { nombre: "Laura Díaz", mesa: 2 },
  { nombre: "Andrés Torres", mesa: 2 },
  { nombre: "Camila Herrera", mesa: 3 },
  { nombre: "Santiago Moreno", mesa: 3 },
  { nombre: "Valentina Castro", mesa: 3 }
];
let modo = "nombre";
const $ = id => document.getElementById(id);
const normalizar = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function render(){
 const q=$("searchInput").value.trim(), box=$("results");
 if(!q){box.innerHTML=`<div class="empty">Escribe ${modo==="nombre"?"un nombre":"un número de mesa"} para consultar.</div>`;return}
 const encontrados=personas.filter(p=>modo==="nombre"?normalizar(p.nombre).includes(normalizar(q)):String(p.mesa)===q);
 box.innerHTML=encontrados.length?encontrados.sort((a,b)=>a.mesa-b.mesa||a.nombre.localeCompare(b.nombre,"es")).map(p=>`<div class="person"><strong>${escapar(p.nombre)}</strong><span class="pill">Mesa ${p.mesa}</span></div>`).join(""):'<div class="empty">No encontramos resultados.</div>';
}
function escapar(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cambiar(m){
 modo=m;$("byName").classList.toggle("active",m==="nombre");$("byTable").classList.toggle("active",m==="mesa");
 $("searchLabel").textContent=m==="nombre"?"Nombre de la persona":"Número de mesa";
 $("searchInput").placeholder=m==="nombre"?"Escribe tu nombre...":"Escribe el número de mesa...";
 $("searchInput").value="";render();
}
$("byName").onclick=()=>cambiar("nombre");$("byTable").onclick=()=>cambiar("mesa");$("searchInput").oninput=render;
</script>
</body>
</html>
